description: 'Highfive was a video collaboration and conferencing company (highfive.com)
  surfaced in the API Evangelist network as a portfolio company of gv and lightspeed-venture-partners.
  The brand was acquired by and folded into Dialpad: highfive.com now issues a 301 redirect to
  dialpad.com/highfive, and developer.highfive.com no longer resolves (NXDOMAIN). Highfive exposes no
  independent developer portal, API documentation, OpenAPI, SDKs, MCP server, or /.well-known/ discovery
  surface of its own; any current programmatic capability lives under the Dialpad platform. This profile
  is retained as an enrichment lead; only a domain-security probe of the surviving highfive.com domain
  yielded real data.'
